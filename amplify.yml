version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend
        - npm install
        - chmod +x node_modules/.bin/react-scripts
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: frontend/build
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
